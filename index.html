<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Staartdeling</title>
<style>
    
/* CSS is Basis opmaak */
    
.gridcell{
    border:1px solid #ccc;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    box-sizing:border-box;
}

table{ border-collapse:collapse; }

.lijnCel{
    /* Niet meer gebruikt, maar laten staan kan geen kwaad */
    height:4px;
    border:none;
    border-top:4px solid #000;
}

/* BOARD */
#controls{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
}

#app{
    margin-left:40px;
    margin-top:20px;
}
#app > *{
    margin-bottom:20px;
}

/* Knoppen */
    
#controls button{
    padding:8px 16px;
    font-size:14px;
    font-weight:600;
    border:1px solid #3a506b;
    background:#f4f7fb;
    color:#1c2541;
    border-radius:6px;
    cursor:pointer;
    transition:all 0.15s ease;
}
#controls button:hover{
    background:#3a506b;
    color:white;
}
#controls button:active{
    transform:scale(0.97);
}
#controls .primary{
    background:#3a506b;
    color:white;
}
#controls select{
    padding:6px 10px;
    font-size:14px;
    border-radius:6px;
    border:1px solid #3a506b;
    background:#ffffff;
}

#opgaveZone{
    font-size:20px;
    font-family:monospace;
    display:flex;
    align-items:center;
    gap:10px;
}

.smallInput{
    width:50px;
    padding:6px 8px;
    font-size:16px;
    font-weight:600;
    border:1px solid #3a506b;
    background:#f4f7fb;
    color:#1c2541;
    border-radius:6px;
    text-align:center;
}
.smallInput:focus{
    outline:none;
    border-color:#1c2541;
}
.rLabel{ font-weight:bold; }

#gridWrapper{
    display:flex;
    align-items:flex-start;
    gap:0px;
}
#leftSide{ display:flex; flex-direction:column; }
#rightSide{ display:flex; flex-direction:column; }
#verticalLine{
    width:3px;
    background:black;
    align-self:stretch;
}
#bar{
    border-top:3px solid black;
    margin:0;
}

/* ==> Nieuw: lijn als border op de aftrek-rij */
.gridcell.aftrek{
    border-top:4px solid #000;
}

/* --- decimale punt links van quotiëntcijfer --- */

.gridcell { 
    position: relative;   /* nodig zodat de punt op de juiste plaats kan */
}

.gridcell.decLeft::before{
    content: ".";
    position:absolute;
    left: 8px;       /* je mag dit later nog finetunen */
    top: -4px;
    font-weight:bold;
    font-size:18px;
    color:#1c2541;
}

</style>

/* ==> HIER komt jouw HTML  */
    
</head>
<body>

<div id="app">
  <h1>Staartdeling</h1>

  <div id="controls">
    <button id="btnNew" class="primary">Nieuwe oefening</button>
    <button id="btnCheck">Nakijken</button>
    <button id="btnSelf">Zelfcontrole</button>

    <label>
      Moeilijkheid:
      <select id="difficulty">
    <option value="1">Basis</option>
    <option value="2">Makkelijk</option>
    <option value="3">Gemiddeld</option>
    <option value="4">Moeilijk</option>
    <option value="5">Zeer moeilijk</option>
    </select>
    </label>
  </div>

  <div id="opgaveZone">
    <span id="opgaveTekst"></span>
    <input id="inputQuotient" type="number" class="smallInput">
    <span class="rLabel">r</span>
    <input id="inputRest" type="number" class="smallInput">
  </div>

  <div id="gridWrapper">
    <div id="leftSide">
      <div id="grid"></div>
      <div id="workArea"></div>
    </div>

    <div id="verticalLine"></div>

    <div id="rightSide">
      <div id="divGrid"></div>
      <div id="bar"></div>
      <div id="quotientRow"></div>
    </div>
  </div>
</div>

<script>
"use strict";
console.log("SCRIPT START");

/* =========================================
   CONFIG (instellingen - Alles wat didactisch instelbaar is)
========================================= */
const CONFIG = {
  maxDecimalen: 3,
  maxDivisor: 20,
  maxQuotient: 50
};

/* =========================================
   STATE (huidige oefening)
========================================= */
const state = {
  dividend: 0,
  divisor: 0,
  stappen: [],
  instellingen: {
    decimalen: false,
    controle: false
  }
};

/* =========================================
   WISKUNDE rekenlogica
========================================= */
/* =========================================
   NIEUWE OEFENINGGENERATOR MET 5 NIVEAUS
========================================= */

function genereerOefening(level) {
    switch(level) {
        case "1":  return genereerBasis();
        case "2":  return genereerMakkelijk();
        case "3":  return genereerGemiddeld();
        case "4":  return genereerMoeilijk();
        case "5":  return genereerZeerMoeilijk();
        default:   return genereerBasis();
    }
}

/* ========== HELPERS ========== */

function rondAf(getal, decimals) {
    return Number(getal.toFixed(decimals));
}

function randomDecimal(min, max, dec) {
    const factor = 10 ** dec;
    return Math.round((Math.random() * (max - min) + min) * factor) / factor;
}

/* =========================================
   1. BASIS — Deeltal 2–3 cijfers • Deler ≤9
   → komt altijd uit
========================================= */
function genereerBasis() {
    const deler = random(2, 9);

    // Kies quotiënt zó dat deeltal 2–3 cijfers wordt
    const quotient = random(2, 99);

    const dividend = deler * quotient;

    if (dividend < 10 || dividend > 999) {
        return genereerBasis(); // herproberen
    }

    return { dividend, divisor: deler };
}

/* =========================================
   2. MAKKELIJK — mag rest hebben
   → deeltal 2–3 cijfers • deler ≤ 9
========================================= */
function genereerMakkelijk() {
    const deler = random(2, 9);
    const dividend = random(10, 999);

    return { dividend, divisor: deler };
}

/* =========================================
   3. GEMIDDELD — tot 2 decimalen
   → Deeltal 3–4 cijfers • Deler ≤ 12
   → komt altijd uit
========================================= */
function genereerGemiddeld() {

    const deler = random(2, 12);

    while (true) {

        // quotient met max 2 decimalen
        const quotient = randomDecimal(1, 300, 2);

        // dividend berekenen
        let dividend = rondAf(deler * quotient, 2);

        // lengte vóór de komma
        const intLen = String(Math.floor(dividend)).length;

        // MOET 3–4 cijfers zijn
        if (intLen >= 3 && intLen <= 4) {
            return { dividend, divisor: deler };
        }

        // anders opnieuw proberen
    }
}

/* =========================================
   4. MOEILIJK — tot 3 decimalen
   → Deeltal 4–5 cijfers • deler ≤ 20
   → komt altijd uit
========================================= */
function genereerMoeilijk() {

    const deler = random(2, 20);
    const quotient = randomDecimal(1, 500, 3);

    let dividend = rondAf(deler * quotient, 3);

    if (String(Math.floor(dividend)).length < 4 ||
        String(Math.floor(dividend)).length > 5) {
        return genereerMoeilijk();
    }

    return { dividend, divisor: deler };
}

/* =========================================
   5. ZEER MOEILIJK
   → DELER kan decimalen hebben (max 2)
   → Deeltal 3–5 cijfers • tot 3 decimalen
   → komt altijd uit
========================================= */
function genereerZeerMoeilijk() {

    const deler = randomDecimal(0.2, 20, 2);  
    const quotient = randomDecimal(1, 500, 3);

    let dividend = rondAf(deler * quotient, 3);

    if (String(Math.floor(dividend)).length < 3 ||
        String(Math.floor(dividend)).length > 5) {
        return genereerZeerMoeilijk();
    }

    return { dividend, divisor: deler };
}

function berekenDelen(deeltal, deler){

    const chars = String(deeltal).replace(',', '.').split(''); // punt of komma → punt
    const stappen = [];

    let rest = 0;
    let gestart = false;
    let digitCol = 0;                // kolomteller over enkel de CIJFERS
    let decimalQuotPos = null;       // positie waar de decimale punt in het quotiënt hoort

    function isDigit(ch){ return ch >= '0' && ch <= '9'; }

    function nextDigitChar(fromIdx){
        for(let j=fromIdx; j<chars.length; j++){
            if(isDigit(chars[j])) return chars[j];
        }
        return "";
    }

    for(let i=0; i<chars.length; i++){

        const ch = chars[i];

        // Punt/komma → niet delen, enkel positie quotiënt-komma bepalen
        if(ch === '.'){
            if(decimalQuotPos === null) decimalQuotPos = stappen.length;
            continue;
        }
        if(!isDigit(ch)) continue; // eender ander niet-cijfer negeren

        const cijfer = Number(ch);
        rest = rest*10 + cijfer;

        if(rest >= deler){
            gestart = true;

            const q = Math.floor(rest/deler);
            const product = q * deler;
            const nieuweRest = rest - product;

            const huidigGetal = rest;
            const breedte = String(huidigGetal).length;
            const startKolom = digitCol - breedte + 1;

            const gezaktVolgende = nextDigitChar(i+1); // sla punt/komma over

            stappen.push({
                huidig: huidigGetal,
                product: product,
                rest: nieuweRest,
                q: q,
                startKolom,
                breedte,
                laatsteCijfer: gezaktVolgende
            });

            rest = nieuweRest;
        }
        else if(gestart){
            // quotientcijfer 0
            const gezaktVolgende = nextDigitChar(i+1);

            stappen.push({
                huidig: rest,
                product: 0,
                rest: rest,
                q: 0,
                startKolom: digitCol,
                breedte: 1,
                laatsteCijfer: gezaktVolgende
            });
        }

        digitCol++; // enkel optellen als we effectief een cijfer verwerkten
    }

    if(decimalQuotPos === null){
        // geen decimaal punt in dividend → punt staat helemaal rechts van het quotiënt
        decimalQuotPos = stappen.length;
    }

    return { stappen, decimalQuotPos };
}
/* =========================================
   HULPFUNCTIES
========================================= */
function random(a,b){
  return Math.floor(Math.random()*(b-a+1))+a;
}

function maakLeegRooster(aantalRijen, aantalKolommen){
  return Array.from({length:aantalRijen}, () =>
    Array.from({length:aantalKolommen}, () =>
      ({waarde:"", type:""})
    )
  );
}

/* === AANGEPAST === */
function vulRooster(state){
  const stappen = state.stappen;
  if(!stappen || stappen.length === 0){
    return [[{waarde:""}]];
  }

  // Neem ook kolom mee waar het “gezakte” cijfer komt (behalve bij de laatste stap)
  const kolommen = Math.max(
    ...stappen.map((s, i) => s.startKolom + s.breedte + (i < stappen.length-1 ? 1 : 0)),
    1
  );

  // 2 rijen per stap: product-rij en aftrek-rij (geen lege voorlooprij)
  const rijen = stappen.length * 2;

  const rooster = maakLeegRooster(rijen, kolommen);

  stappen.forEach((stap, index) => {
    const productRij = index * 2;
    const aftrekRij  = productRij + 1;

    const productStr = String(stap.product).padStart(stap.breedte,"0");
    const aftrekStr  = String(stap.rest).padStart(stap.breedte,"0");

    // product
    for(let i=0;i<stap.breedte;i++){
      rooster[productRij][stap.startKolom+i] =
        {waarde:productStr[i], type:"product"};
    }

    // verschil (rest) — met dikke bovenrand als scheidingslijn
    for(let i=0;i<stap.breedte;i++){
      rooster[aftrekRij][stap.startKolom+i] =
        {waarde:aftrekStr[i], type:"aftrek"};
    }

    // cijfer laten zakken (indien niet de laatste stap)
    if(index < stappen.length-1){
      const gezakt = stap.laatsteCijfer || "";
      const col = stap.startKolom + stap.breedte;
      rooster[aftrekRij][col] = {waarde:gezakt, type:"gezakt"};
    }
  });

  return rooster;
}

/* =========================================
   UI of JS
========================================= */
const UI = {
  init(){
    this.cacheDOM();
    document.getElementById("btnNew")
      .addEventListener("click", startNieuweOefening);
  },
  cacheDOM(){
    this.dividendNode = document.getElementById("grid");
    this.divisorNode  = document.getElementById("divGrid");
    this.quotientNode = document.getElementById("quotientRow");
    this.workAreaNode = document.getElementById("workArea");
  },
  tekenOefening(state){
    this.tekenDividend(state.dividend);
    this.tekenDivisor(state.divisor);
    this.tekenQuotient(state.stappen);
    this.tekenworkArea(state);
  },
  tekenDividend(getal){
    if(!this.dividendNode) return;
    this.dividendNode.innerHTML = "";
    const cijfers = String(getal).split("");
    this.dividendNode.style.display = "grid";
    this.dividendNode.style.gridTemplateColumns = `repeat(${cijfers.length},40px)`;
    cijfers.forEach(cijfer=>{
      const cel = document.createElement("div");
      cel.className = "gridcell";
      cel.textContent = cijfer;
      this.dividendNode.appendChild(cel);
    });
  },
  tekenDivisor(getal){
    if(!this.divisorNode) return;
    this.divisorNode.innerHTML = "";
    const cijfers = String(getal).split("");
    this.divisorNode.style.display = "grid";
    this.divisorNode.style.gridTemplateColumns = `repeat(${cijfers.length},40px)`;
    cijfers.forEach(cijfer=>{
      const cel = document.createElement("div");
      cel.className = "gridcell";
      cel.textContent = cijfer;
      this.divisorNode.appendChild(cel);
    });
  },
 tekenQuotient(stappen){

    this.quotientNode.innerHTML="";

    const kolommen = stappen.length;

    this.quotientNode.style.display="grid";
    this.quotientNode.style.gridTemplateColumns = `repeat(${kolommen},40px)`;

    stappen.forEach((stap, idx) => {
        const cel = document.createElement("div");
        cel.className = "gridcell";
        cel.textContent = stap.q;

        // toon de door leerling geplaatste punt (links van deze cel)
        if(state.userDecimalPos === idx){
            cel.classList.add("decLeft");
        }

        // leerling klikt om de punt te plaatsen
        cel.addEventListener("click", () => {
            state.userDecimalPos = idx;   // zet punt links van dit quotiëntcijfer
            this.tekenQuotient(state.stappen);
        });

        this.quotientNode.appendChild(cel);
    });
},
  /* === AANGEPAST === */
  tekenworkArea(state){
    if(!this.workAreaNode) return;
    this.workAreaNode.innerHTML = "";

    const rooster = vulRooster(state);
    if(!rooster || rooster.length === 0) return;

    const rows = rooster.length;
    const cols = Math.max(...rooster.map(r => r.length)); // neem de langste rij

    this.workAreaNode.style.display = "grid";
    this.workAreaNode.style.gridTemplateColumns = `repeat(${cols},40px)`;
    this.workAreaNode.style.gridTemplateRows = `repeat(${rows},40px)`;

    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const celData = (rooster[r] && rooster[r][c]) ? rooster[r][c] : {waarde:"", type:""};
        const cel = document.createElement("div");
        cel.className = "gridcell";
        if(celData.type){
          cel.classList.add(celData.type); // voegt .aftrek toe voor de lijn
        }
        cel.textContent = (celData.type === "lijn") ? "" : (celData.waarde || "");
        this.workAreaNode.appendChild(cel);
      }
    }
  }
};

/* =========================================
   START
========================================= */
function startNieuweOefening(){

    // Huidig: haal deeltal/deler (of gebruik jouw generator per niveau)
    const diff = document.getElementById("difficulty").value;
    const oef = genereerOefening(diff);
    const deeltal = oef.dividend;
    const deler   = oef.divisor;

    state.dividend = deeltal;
    state.divisor  = deler;

    const res = berekenDelen(deeltal, deler);
    state.stappen = res.stappen;

    // NIEUW: waar hoort de komma in het quotiënt (leerling zet ze zelf)
    state.decimalQuotPos = res.decimalQuotPos;
    state.userDecimalPos = null; // leerling nog niet gezet

    document.getElementById("opgaveTekst").textContent =
        `${deeltal} : ${deler} =`;

    UI.tekenOefening(state);
}

/* =========================================
   BOOTSTRAP - START PROGRAMMA
========================================= */
window.addEventListener("DOMContentLoaded", () => {
  UI.init();
  startNieuweOefening();
});
</script>
</body>
</html>
