<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
    
<title>Staartdeling</title>

<style>

/* HIER komt jouw CSS */

.gridcell{
    border:1px solid #ccc;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}
    
.lijnCel{
    height:4px;
    border:none;
    border-top:4px solid #000;
}
    
/* BOARD */
#controls{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
}

    #app{
    margin-left:40px;
    margin-top:20px;
}
    #app > *{
    margin-bottom:20px;
}
    
/* Knoppen */

#controls button{
    padding:8px 16px;
    font-size:14px;
    font-weight:600;
    border:1px solid #3a506b;
    background:#f4f7fb;
    color:#1c2541;
    border-radius:6px;
    cursor:pointer;
    transition:all 0.15s ease;
}

#opgaveZone{
    font-size:20px;
    font-family:monospace;
    display:flex;
    align-items:center;
    gap:10px;
}

.smallInput{
    width:50px;
    padding:6px 8px;
    font-size:16px;
    font-weight:600;
    border:1px solid #3a506b;
    background:#f4f7fb;
    color:#1c2541;
    border-radius:6px;
    text-align:center;
}

.smallInput:focus{
    outline:none;
    border-color:#1c2541;
}

.rLabel{
    font-weight:bold;
}

#controls button:hover{
    background:#3a506b;
    color:white;
}

#controls button:active{
    transform:scale(0.97);
}

/* Hoofdactie iets sterker */

#controls .primary{
    background:#3a506b;
    color:white;
}

/* Select */

#controls select{
    padding:6px 10px;
    font-size:14px;
    border-radius:6px;
    border:1px solid #3a506b;
    background:#ffffff;
}
    
    #gridWrapper{
    display:flex;
    align-items:flex-start;
    gap:0px;
}

#leftSide{
    display:flex;
    flex-direction:column;
}

#rightSide{
    display:flex;
    flex-direction:column;
}

#verticalLine{
    width:3px;
    background:black;
    align-self:stretch;
}

#bar{
    border-top:3px solid black;
    margin:0;
}
    
</style>

<!-- HIER komt jouw HTML -->
    
</head>
<body>

<div id="app">
    
<h1>Staartdeling</h1>

<div id="controls">
    <button id="btnNew">Nieuwe oefening</button>
    <button id="btnCheck">Nakijken</button>
    <button id="btnSelf">Zelfcontrole</button>

    <label>
        Moeilijkheid:
        <select id="difficulty">
            <option value="1">Makkelijk</option>
            <option value="2">Gemiddeld</option>
            <option value="3">Moeilijk</option>
        </select>
    </label>
</div>

<div id="opgaveZone">
    <span id="opgaveTekst"></span>

    <input id="inputQuotient" type="number" class="smallInput">

    <span class="rLabel">r</span>

    <input id="inputRest" type="number" class="smallInput">
</div>
    
<div id="gridWrapper">

  <div id="leftSide">
    <div id="grid"></div>
    <div id="workArea"></div>
  </div>

  <div id="verticalLine"></div>

  <div id="rightSide">
    <div id="divGrid"></div>
    <div id="bar"></div>
    <div id="quotientRow"></div>
  </div>

</div>

</div>
    
<script>
"use strict";

/* =========================================
   CONFIGURATIE (instellingen - Alles wat didactisch instelbaar is)
========================================= */

const CONFIG = {
    maxDecimalen: 3,
    maxDivisor: 20,
    maxQuotient: 50
};


/* =========================================
   STATE (huidige oefening)
========================================= */

const state = {
    dividend: 0,
    divisor: 0,
    stappen: [],
    instellingen: {
        decimalen: false,
        controle: false
    }
};


/* =========================================
   WISKUNDE MODULE
   → Hier staat ENKEL rekenlogica
   → Geen HTML, geen kleuren
========================================= */


//Deze functie maakt een nieuwe oefening.
function genereerOefening(){
    const divisor = random(2, CONFIG.maxDivisor);
    const quotient = random(2, CONFIG.maxQuotient);
    const dividend = divisor * quotient;

    return { dividend, divisor };
}

//Deze functie doet ALLES wat je leerlingen op papier doen
function berekenDelen(deeltal, deler){

    const stappen = [];
    const cijfers = String(deeltal).split("");

    let rest = 0;
    let positie = 0;

    while(positie < cijfers.length){

        rest = rest * 10 + Number(cijfers[positie]);

        if(rest >= deler){

            const q = Math.floor(rest / deler);
            const product = q * deler;
            const nieuweRest = rest - product;

            const huidigGetal = rest;

            stappen.push({
                huidig: huidigGetal,
                product: product,
                rest: nieuweRest,
                q: q,
                startKolom: positie - String(huidigGetal).length + 1,
                breedte: String(huidigGetal).length
});

            rest = nieuweRest;
        }

        positie++;
    }

    return { stappen };
}
/* =========================================
   HULPFUNCTIES
========================================= */

function random(a,b){
    return Math.floor(Math.random()*(b-a+1))+a;
}

function maakLeegRooster(aantalRijen, aantalKolommen){

    return Array.from({length:aantalRijen}, () =>
        Array.from({length:aantalKolommen}, () =>
            ({waarde:"", type:""})
        )
    );
}
    
function vulRooster(state){

    const stappen = state.stappen;

    if(stappen.length === 0){
        return [[{waarde:""}]];
    }

    const kolommen = Math.max(...stappen.map(s =>
        s.startKolom + s.breedte
    ));

    const rijen = stappen.length * 3 + 2;

    const rooster = maakLeegRooster(rijen, kolommen);

    stappen.forEach((stap, index)=>{

        const productRij = 1 + index*3;
        const lijnRij = productRij + 1;
        const aftrekRij = productRij + 2;

        const productStr =
            String(stap.product).padStart(stap.breedte,"0");

        const aftrekStr =
            String(stap.rest).padStart(stap.breedte,"0");

        // product
        for(let i=0;i<stap.breedte;i++){
            rooster[productRij][stap.startKolom+i] =
                {waarde:productStr[i], type:"product"};
        }

        // horizontale lijn
        for(let i=0;i<stap.breedte;i++){
            rooster[lijnRij][stap.startKolom+i] =
                {waarde:"", type:"lijn"};
        }

        // verschil (rest)
        for(let i=0;i<stap.breedte;i++){
            rooster[aftrekRij][stap.startKolom+i] =
                {waarde:aftrekStr[i], type:"aftrek"};
        }

        // cijfer laten zakken
        if(index < stappen.length-1){

            const volgende =
                String(stappen[index+1].huidig);

            const gezakt =
                volgende[volgende.length-1];

            rooster[aftrekRij][stap.startKolom + stap.breedte] =
                {waarde:gezakt, type:"gezakt"};
        }

    });

    return rooster;
}
   
/* =========================================
   UI MODULE of JS
   → Alles wat met tekenen te maken heeft
   → Geen berekeningen hier!
========================================= */

const UI = {

    init(){
        this.cacheDOM();

        document.getElementById("btnNew")
            .addEventListener("click", startNieuweOefening);

        console.log("grid node:", this.dividendNode);
        console.log("divGrid node:", this.divisorNode);
    },

    cacheDOM(){
        this.dividendNode = document.getElementById("grid");
        this.divisorNode = document.getElementById("divGrid");
        this.quotientNode = document.getElementById("quotientRow");
        this.workAreaNode = document.getElementById("workArea");
    },

    tekenOefening(state){
        this.tekenDividend(state.dividend);
        this.tekenDivisor(state.divisor);
        this.tekenQuotient(state.stappen);
        this.tekenworkArea(state);
    },

    tekenDividend(getal){

        if(!this.dividendNode) return;

        this.dividendNode.innerHTML = "";

        const cijfers = String(getal).split("");

        this.dividendNode.style.display = "grid";
        this.dividendNode.style.gridTemplateColumns =
            `repeat(${cijfers.length},40px)`;

        cijfers.forEach(cijfer=>{
            const cel = document.createElement("div");
            cel.className = "gridcell";
            cel.textContent = cijfer;

            this.dividendNode.appendChild(cel);
        });
    },

    tekenDivisor(getal){

        if(!this.divisorNode) return;

        this.divisorNode.innerHTML = "";

        const cijfers = String(getal).split("");

        this.divisorNode.style.display = "grid";
        this.divisorNode.style.gridTemplateColumns =
            `repeat(${cijfers.length},40px)`;

        cijfers.forEach(cijfer=>{
            const cel = document.createElement("div");
            cel.className = "gridcell";
            cel.textContent = cijfer;

            this.divisorNode.appendChild(cel);
        });
    },

    tekenQuotient(stappen){

    this.quotientNode.innerHTML="";

    const kolommen = stappen.length;

    this.quotientNode.style.display="grid";
    this.quotientNode.style.gridTemplateColumns =
        `repeat(${kolommen},40px)`;

    stappen.forEach(stap=>{
        const cel = document.createElement("div");
        cel.className="gridcell";
        cel.textContent = stap.q;

        this.quotientNode.appendChild(cel);
    });
},

   tekenworkArea(state){

    const rooster = vulRooster(state);

    const tabel = document.createElement("table");

    rooster.forEach(rij=>{

        const tr = document.createElement("tr");

        rij.forEach(cel=>{

            const td = document.createElement("td");
            td.className = "gridcell";
            td.textContent = cel.waarde;

            if(cel.type === "lijn"){
                td.style.borderBottom = "3px solid black";
                td.style.height = "8px";
            }

            if(cel.type === "gezakt"){
                td.style.color = "blue";
            }

            tr.appendChild(td);
        });

        tabel.appendChild(tr);
    });

    const workArea = document.getElementById("workArea");
    workArea.innerHTML = "";
    workArea.appendChild(tabel);
}

};
   
/* =========================================
   START
========================================= */

function startNieuweOefening(){

    const deeltal = 192;
    const deler = 4;

    state.dividend = deeltal;
    state.divisor = deler;

    state.stappen = berekenDelen(deeltal, deler).stappen;

    document.getElementById("opgaveTekst").textContent =
        `${deeltal} : ${deler} =`;

    UI.tekenOefening(state);
}
    
/* =========================================
   START PROGRAMMA
========================================= */

window.addEventListener("DOMContentLoaded", () => {
    UI.init();
    startNieuweOefening();
});
    
</script>

</body>
</html>
