<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
    
<title>Staartdeling</title>

<style>

/* HIER komt jouw CSS */

#gridWrapper{
    display:flex;
    align-items:flex-start;
}

.gridcell{
    border:1px solid #ccc;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}
    
#divisionLine{
    width:4px;
    background:black;
    align-self:stretch;
    margin:0 20px;
    border-radius:2px;
}

#rightSide{
    display:flex;
    flex-direction:column;
}

#hbar{
    height:4px;
    background:black;
    margin-top:5px;
}

</style>

</head>
<body>

<h1>Staartdeling</h1>

<div id="board">
    <div id="gridWrapper">
        <div id="grid"></div>

        <div id="divisionLine"></div>

        <div id="rightSide">
            <div id="divGrid"></div>
            <div id="hbar"></div>
        </div>
    </div>
</div>

<script>
"use strict";

/* =========================================
   CONFIGURATIE (instellingen - Alles wat didactisch instelbaar is)
========================================= */

const CONFIG = {
    maxDecimalen: 3,
    maxDivisor: 20,
    maxQuotient: 50
};


/* =========================================
   STATE (huidige oefening)
========================================= */

const state = {
    dividend: 0,
    divisor: 0,
    stappen: [],
    instellingen: {
        decimalen: false,
        controle: false
    }
};


/* =========================================
   WISKUNDE MODULE
   → Hier staat ENKEL rekenlogica
   → Geen HTML, geen kleuren
========================================= */


//Deze functie maakt een nieuwe oefening.
function genereerOefening(){
    const divisor = random(2, CONFIG.maxDivisor);
    const quotient = random(2, CONFIG.maxQuotient);
    const dividend = divisor * quotient;

    return { dividend, divisor };
}

//Deze functie doet ALLES wat je leerlingen op papier doen
function berekenStappen(deeltal, deler, maxDecimalen){
    let stappen = [];
    let cijfers = String(deeltal).split("");

    let rest = 0;
    let i = 0;

    let huidig = parseInt(cijfers[0],10);
    if (huidig < deler && cijfers.length > 1){
        huidig = parseInt(cijfers[0] + cijfers[1],10);
        i = 2;
    } else {
        i = 1;
    }

    let q = Math.floor(huidig / deler);
    let product = q * deler;
    let aftrek = huidig - product;

    stappen.push({ huidig, q, product, aftrek });
    rest = aftrek;

    for (; i < cijfers.length; i++){
        huidig = rest * 10 + parseInt(cijfers[i],10);
        q = Math.floor(huidig / deler);
        product = q * deler;
        aftrek = huidig - product;

        stappen.push({ huidig, q, product, aftrek });
        rest = aftrek;
    }

    let dec = 0;
    while (rest !== 0 && dec < maxDecimalen){
        huidig = rest * 10;
        q = Math.floor(huidig / deler);
        product = q * deler;
        aftrek = huidig - product;

        stappen.push({ huidig, q, product, aftrek });
        rest = aftrek;
        dec++;
    }

    return stappen;
}


/* =========================================
   HULPFUNCTIES
========================================= */

function random(a,b){
    return Math.floor(Math.random()*(b-a+1))+a;
}

   
/* =========================================
   UI MODULE
   → Alles wat met tekenen te maken heeft
   → Geen berekeningen hier!
========================================= */

const UI = {

    init(){
        this.cacheDOM();
        this.tekenLayout();
    },

    cacheDOM(){
        this.dividendNode = document.getElementById("grid");
        this.divisorNode  = document.getElementById("divGrid");
        this.board = document.getElementById("board");
    },

    tekenLayout(){
        this.board.style.maxWidth = "900px";
        this.board.style.margin = "auto";

        document.getElementById("gridWrapper").style.display = "flex";
        document.getElementById("gridWrapper").style.alignItems = "flex-start";

        document.getElementById("divisionLine").style.width = "4px";
        document.getElementById("divisionLine").style.background = "black";
        document.getElementById("divisionLine").style.margin = "0 20px";
    },

    tekenOefening(state){
        this.tekenDividend(state.dividend);
        this.tekenDivisor(state.divisor);
    },

    tekenDividend(getal){
        this.dividendNode.innerHTML = "";

        const cijfers = String(getal).split("");

        this.dividendNode.style.display = "grid";
        this.dividendNode.style.gridTemplateColumns =
            `repeat(${cijfers.length}, 40px)`;

        cijfers.forEach(cijfer=>{
            const cel = document.createElement("div");
            cel.textContent = cijfer;
            const cel = document.createElement("div");
            cel.className = "gridcell";
            cel.textContent = cijfer;
            
            this.dividendNode.appendChild(cel);
        });
    },

    tekenDivisor(getal){
        this.divisorNode.innerHTML="";

        const cijfers = String(getal).split("");

        this.divisorNode.style.display="grid";
        this.divisorNode.style.gridTemplateColumns =
            `repeat(${cijfers.length},40px)`;

        cijfers.forEach(cijfer=>{
            const cel=document.createElement("div");
            cel.textContent=cijfer;
            const cel = document.createElement("div");
            cel.className = "gridcell";
            cel.textContent = cijfer;

            this.divisorNode.appendChild(cel);
        });
    }
};
   
/* =========================================
   START
========================================= */

function startNieuweOefening(){

    const oef = genereerOefening();

    state.dividend = oef.dividend;
    state.divisor  = oef.divisor;

    state.stappen = berekenStappen(
        state.dividend,
        state.divisor,
        CONFIG.maxDecimalen
    );

    UI.tekenOefening(state);
}
    
/* =========================================
   START PROGRAMMA
========================================= */

UI.init();
startNieuweOefening();
    
</script>

</body>
</html>
