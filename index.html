<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
    
<title>Staartdeling</title>

<style>

/* HIER komt jouw CSS */

.gridcell{
    border:1px solid #ccc;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* BOARD */
#controls{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
}

    #app{
    margin-left:40px;
    margin-top:20px;
}
    #app > *{
    margin-bottom:20px;
}
    
/* Knoppen */

#controls button{
    padding:8px 16px;
    font-size:14px;
    font-weight:600;
    border:1px solid #3a506b;
    background:#f4f7fb;
    color:#1c2541;
    border-radius:6px;
    cursor:pointer;
    transition:all 0.15s ease;
}

#opgaveZone{
    font-size:20px;
    font-family:monospace;
    display:flex;
    align-items:center;
    gap:10px;
}

.smallInput{
    width:50px;
    padding:6px 8px;
    font-size:16px;
    font-weight:600;
    border:1px solid #3a506b;
    background:#f4f7fb;
    color:#1c2541;
    border-radius:6px;
    text-align:center;
}

.smallInput:focus{
    outline:none;
    border-color:#1c2541;
}

.rLabel{
    font-weight:bold;
}

#controls button:hover{
    background:#3a506b;
    color:white;
}

#controls button:active{
    transform:scale(0.97);
}

/* Hoofdactie iets sterker */

#controls .primary{
    background:#3a506b;
    color:white;
}

/* Select */

#controls select{
    padding:6px 10px;
    font-size:14px;
    border-radius:6px;
    border:1px solid #3a506b;
    background:#ffffff;
}
    
    #gridWrapper{
    display:flex;
    align-items:flex-start;
    gap:0px;
}

#leftSide{
    display:flex;
    flex-direction:column;
}

#rightSide{
    display:flex;
    flex-direction:column;
}

#verticalLine{
    width:3px;
    background:black;
    align-self:stretch;
}

#bar{
    border-top:3px solid black;
    margin:0;
}
    
</style>

<!-- HIER komt jouw HTML -->
    
</head>
<body>

<div id="app">
    
<h1>Staartdeling</h1>

<div id="controls">
    <button id="btnNew">Nieuwe oefening</button>
    <button id="btnCheck">Nakijken</button>
    <button id="btnSelf">Zelfcontrole</button>

    <label>
        Moeilijkheid:
        <select id="difficulty">
            <option value="1">Makkelijk</option>
            <option value="2">Gemiddeld</option>
            <option value="3">Moeilijk</option>
        </select>
    </label>
</div>

<div id="opgaveZone">
    <span id="opgaveTekst"></span>

    <input id="inputQuotient" type="number" class="smallInput">

    <span class="rLabel">r</span>

    <input id="inputRest" type="number" class="smallInput">
</div>
    
<div id="gridWrapper">

  <div id="leftSide">
    <div id="grid"></div>
    <div id="workArea"></div>
  </div>

  <div id="verticalLine"></div>

  <div id="rightSide">
    <div id="divGrid"></div>
    <div id="bar"></div>
    <div id="quotientRow"></div>
  </div>

</div>

</div>
    
<script>
"use strict";

/* =========================================
   CONFIGURATIE (instellingen - Alles wat didactisch instelbaar is)
========================================= */

const CONFIG = {
    maxDecimalen: 3,
    maxDivisor: 20,
    maxQuotient: 50
};


/* =========================================
   STATE (huidige oefening)
========================================= */

const state = {
    dividend: 0,
    divisor: 0,
    stappen: [],
    instellingen: {
        decimalen: false,
        controle: false
    }
};


/* =========================================
   WISKUNDE MODULE
   → Hier staat ENKEL rekenlogica
   → Geen HTML, geen kleuren
========================================= */


//Deze functie maakt een nieuwe oefening.
function genereerOefening(){
    const divisor = random(2, CONFIG.maxDivisor);
    const quotient = random(2, CONFIG.maxQuotient);
    const dividend = divisor * quotient;

    return { dividend, divisor };
}

//Deze functie doet ALLES wat je leerlingen op papier doen
function berekenStappen(deeltal, deler, maxDecimalen){

    let stappen = [];
    let cijfers = String(deeltal).split("");

    let rest = 0;
    let i = 0;
    let startKolom = 0;

    let huidig = parseInt(cijfers[0],10);

    if (huidig < deler && cijfers.length > 1){
        huidig = parseInt(cijfers[0] + cijfers[1],10);
        i = 2;
    } else {
        i = 1;
    }

    let q = Math.floor(huidig / deler);
    let product = q * deler;
    let aftrek = huidig - product;

    stappen.push({
        huidig,
        q,
        product,
        aftrek,
        startKolom,
        breedte: String(huidig).length
    });

    huidig += deeltalStr[i];

    if (Number(huidig) >= deler) {

        const q = Math.floor(Number(huidig) / deler);
        const product = q * deler;
        const rest = Number(huidig) - product;

        stappen.push({
            huidig: Number(huidig),
            q: q,
            product: product,
            rest: rest,
            startKolom: startIndex,
            breedte: huidig.length
        });

        huidig = String(rest);

    }
}
/* =========================================
   HULPFUNCTIES
========================================= */

function random(a,b){
    return Math.floor(Math.random()*(b-a+1))+a;
}

function maakCel(waarde=""){
    const cel = document.createElement("div");
    cel.className = "gridcell";

    cel.textContent = waarde;

    return cel;
}

function maakLeegRooster(state){

    let kolommen = 0;

    state.stappen.forEach(stap=>{
        kolommen = Math.max(kolommen, stap.startKolom + stap.breedte);
    });

    const rijen = 1 + state.stappen.length * 3;

    let rooster = [];

    for(let r = 0; r < rijen; r++){

        let rij = [];

        for(let k = 0; k < kolommen; k++){

            rij.push({
                waarde: "",
                type: "",
                actief: false,
                verplicht: false
            });

        }

        rooster.push(rij);
    }

    return rooster;
}

function vulCorrectRooster(state){

    const rooster = maakLeegRooster(state);

    // --- QUOTIENT (rij 0) ---
    state.stappen.forEach((stap, index)=>{
        rooster[0][stap.startKolom + stap.breedte - 1] = {
            waarde: String(stap.q),
            type: "quotient",
            actief: true,
            verplicht: true
        };
    });

    // --- PRODUCT + AFTREK ---
    state.stappen.forEach((stap, index)=>{

        const productRij = 1 + index*2;
        const aftrekRij  = productRij + 1;

        const productStr = String(stap.product).padStart(stap.breedte,"0");
        const aftrekStr  = String(stap.aftrek).padStart(stap.breedte,"0");

        for(let i = 0; i < stap.breedte; i++){
            rooster[productRij][stap.startKolom + i] = {
                waarde: productStr[i],
                type: "product",
                actief: true,
                verplicht: true
            };
            rooster[aftrekRij][stap.startKolom + i] = {
                waarde: aftrekStr[i],
                type: "aftrek",
                actief: true,
                verplicht: true
            };
        }

    });

    return rooster;
}
   
/* =========================================
   UI MODULE of JS
   → Alles wat met tekenen te maken heeft
   → Geen berekeningen hier!
========================================= */

const UI = {

    init(){
        this.cacheDOM();

        document.getElementById("btnNew")
            .addEventListener("click", startNieuweOefening);

        console.log("grid node:", this.dividendNode);
        console.log("divGrid node:", this.divisorNode);
    },

    cacheDOM(){
        this.dividendNode = document.getElementById("grid");
        this.divisorNode = document.getElementById("divGrid");
        this.quotientNode = document.getElementById("quotientRow");
        this.workAreaNode = document.getElementById("workArea");
    },

    tekenOefening(state){
        this.tekenDividend(state.dividend);
        this.tekenDivisor(state.divisor);
        this.tekenQuotient(state.stappen);
        this.tekenWerkveld(state);
    },

    tekenDividend(getal){

        if(!this.dividendNode) return;

        this.dividendNode.innerHTML = "";

        const cijfers = String(getal).split("");

        this.dividendNode.style.display = "grid";
        this.dividendNode.style.gridTemplateColumns =
            `repeat(${cijfers.length},40px)`;

        cijfers.forEach(cijfer=>{
            const cel = document.createElement("div");
            cel.className = "gridcell";
            cel.textContent = cijfer;

            this.dividendNode.appendChild(cel);
        });
    },

    tekenDivisor(getal){

        if(!this.divisorNode) return;

        this.divisorNode.innerHTML = "";

        const cijfers = String(getal).split("");

        this.divisorNode.style.display = "grid";
        this.divisorNode.style.gridTemplateColumns =
            `repeat(${cijfers.length},40px)`;

        cijfers.forEach(cijfer=>{
            const cel = document.createElement("div");
            cel.className = "gridcell";
            cel.textContent = cijfer;

            this.divisorNode.appendChild(cel);
        });
    },

    tekenQuotient(stappen){

    this.quotientNode.innerHTML="";

    const kolommen = stappen.length;

    this.quotientNode.style.display="grid";
    this.quotientNode.style.gridTemplateColumns =
        `repeat(${kolommen},40px)`;

    stappen.forEach(stap=>{
        const cel = document.createElement("div");
        cel.className="gridcell";
        cel.textContent = stap.q;

        this.quotientNode.appendChild(cel);
    });
},

   tekenWerkveld(state){

    this.workAreaNode.innerHTML = "";

    const rooster = vulCorrectRooster(state);

    const aantalKolommen = rooster[0].length;

    this.workAreaNode.style.display = "grid";
    this.workAreaNode.style.gridTemplateColumns =
        `repeat(${aantalKolommen}, 40px)`;

    // ⭐ START VANAF RIJ 1 (quotient wordt niet hier getekend)
    for(let r = 1; r < rooster.length; r++){
        for(let c = 0; c < aantalKolommen; c++){

            const cel = document.createElement("div");
            cel.className = "gridcell";
            cel.textContent = rooster[r][c].waarde;

            this.workAreaNode.appendChild(cel);
        }
    }
}
    
};
   
/* =========================================
   START
========================================= */

function startNieuweOefening(){

    const oef = genereerOefening();

    document.getElementById("inputQuotient").value = "";
    document.getElementById("inputRest").value = "";
    document.getElementById("inputQuotient").focus();

    state.dividend = oef.dividend;
    state.divisor  = oef.divisor;

    state.stappen = berekenStappen(
        state.dividend,
        state.divisor,
        CONFIG.maxDecimalen
    );

    console.log("STAPPEN:", state.stappen);   // ← HIER
    
    UI.tekenOefening(state);

    const opgave = document.getElementById("opgaveTekst");
    const correctRooster = vulCorrectRooster(state);
    console.log(correctRooster);

    if(opgave){
        const quotient = Math.floor(state.dividend / state.divisor);
        const rest = state.dividend % state.divisor;

        opgave.textContent =
            `${state.dividend} ÷ ${state.divisor} =`;
    }
}
    
/* =========================================
   START PROGRAMMA
========================================= */

window.addEventListener("DOMContentLoaded", () => {
    UI.init();
    startNieuweOefening();
});
    
</script>

</body>
</html>
