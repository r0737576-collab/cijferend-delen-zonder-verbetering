<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Staartdeling inoefenen</title>
  <style>
    /* ====== Basis opmaak ====== */
    .gridcell{
      border:1px solid #ccc;
      width:40px;
      height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      box-sizing:border-box;
      position: relative; /* nodig voor leesteken positionering */
    }

    table{ border-collapse:collapse; }

    .lijnCel{
      /* Niet meer gebruikt, mag blijven */
      height:4px;
      border:none;
      border-top:4px solid #000;
    }

    /* BOARD */
    #controls{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }

    #app{
      margin-left:40px;
      margin-top:20px;
    }
    #app > *{
      margin-bottom:20px;
    }

    /* Knoppen */
    #controls button{
      padding:8px 16px;
      font-size:14px;
      font-weight:600;
      border:1px solid #3a506b;
      background:#f4f7fb;
      color:#1c2541;
      border-radius:6px;
      cursor:pointer;
      transition:all 0.15s ease;
    }
    #controls button:hover{
      background:#3a506b;
      color:white;
    }
    #controls button:active{
      transform:scale(0.97);
    }
    #controls .primary{
      background:#3a506b;
      color:white;
    }
    #controls select{
      padding:6px 10px;
      font-size:14px;
      border-radius:6px;
      border:1px solid #3a506b;
      background:#ffffff;
    }

    #opgaveZone{
      font-size:20px;
      font-family:monospace;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .smallInput{
      width:110px;             /* iets breder voor quotiënt met komma */
      padding:6px 8px;
      font-size:16px;
      font-weight:600;
      border:1px solid #3a506b;
      background:#f4f7fb;
      color:#1c2541;
      border-radius:6px;
      text-align:center;
    }
    .smallInput:focus{
      outline:none;
      border-color:#1c2541;
    }

    .rLabel{ font-weight:bold; }

    #gridWrapper{
      display:flex;
      align-items:flex-start;
      gap:0px;
    }
    #leftSide{ display:flex; flex-direction:column; }
    #rightSide{ display:flex; flex-direction:column; }
    #verticalLine{
      width:3px;
      background:black;
      align-self:stretch;
    }
    #bar{
      border-top:3px solid black;
      margin:0;
    }

    /* aftrek-rij (dikke bovengrens) */
    .gridcell.aftrek{
      border-top:4px solid #000;
    }

    /* decimale punt links van quotiëntcijfer (niet actief, ter referentie) */
    .gridcell.decLeft::before{
      content: ",";
      position:absolute;
      left: 8px;
      top: -4px;
      font-weight:bold;
      font-size:18px;
      color:#1c2541;
    }

    /* Cel voor de komma in het quotiënt */
    .gridcell.comma {
      background: #f4f7fb;
      color: #1c2541;
      cursor: pointer;
      font-weight: 900;
      border: 2px dashed #1c2541;  /* zichtbaar als "komma-plek" */
    }
    .gridcell.comma:hover {
      background: #e6eef9;
    }
    .gridcell.comma.userPlaced {
      background: #ffe8a1; /* geel als de leerling de komma hier zette */
    }
    .gridcell.comma.expected {
      outline: 2px dashed #2a9d8f; /* markeer waar ze hoort bij zelfcontrole */
    }
    .gridcell.comma.wrong {
      background: #ffc9c9; /* rood als fout bij nakijken */
    }

    /* Visuele feedback voor de gekozen invoerpositie (optioneel) */
    .gridcell.sel {
      outline: 2px solid #3a506b;
    }

    /* Verticale groene lijn op de rastercel (linkerrand) */
    .gridcell.vComma {
      border-left: 4px solid #2a9d8f !important;
    }
    /* ====== Feedback UI ====== */
  #feedbackPanel { 
  margin-top: 10px; 
  font-size: 15px; 
  max-width: 680px;
  }
  .msg { 
  padding: 8px 10px; 
  border-radius: 6px; 
  margin: 6px 0; 
  line-height: 1.3;
  }
  .msg.ok { background: #e6f4ea; border: 1px solid #2e7d32; color: #1b5e20; }
  .msg.err { background: #ffe8e8; border: 1px solid #c62828; color: #7f1d1d; }
  .msg.info { background: #eef4ff; border: 1px solid #3558a2; color: #1c2b5a; }

  .input-ok { border-color: #2e7d32 !important; box-shadow: 0 0 0 2px rgba(46,125,50,.15); }
  .input-err { border-color: #c62828 !important; box-shadow: 0 0 0 2px rgba(198,40,40,.15); }

  /* ===== Stap-voor-stap paneel ===== */
#stepInputs { 
  margin-top: 16px; 
  max-width: 820px; 
}

.stepRow {
  display: grid;
  grid-template-columns: auto 100px 120px 120px 120px;
  gap: 8px;
  align-items: center;
  margin: 6px 0;
}

.stepHead {
  font-weight: 700;
  color: #1c2541;
}

.stepInput {
  width: 100%;
  padding: 6px 8px;
  font-size: 14px;
  text-align: center;
  border: 1px solid #3a506b;
  border-radius: 6px;
  background: #fff;
  box-sizing: border-box;
}

  /* Kleurfeedback per veld (juist/fout) */
  .step-ok  { border-color: #2e7d32 !important; box-shadow: 0 0 0 2px rgba(46,125,50,.15); }
  .step-err { border-color: #c62828 !important; box-shadow: 0 0 0 2px rgba(198,40,40,.15); }

  /* Kleine hulptekst */
  .mini { font-size: 12px; color: #415a77; line-height: 1.2; }

  /* ===== Invulbare rooster-cellen ===== */
  .gridcell.editable {
  background: #ffffff;
  cursor: text;
  outline: none;
  border: 1px solid #3a506b;
  }
  .gridcell.editable:focus {
  box-shadow: 0 0 0 2px rgba(53,88,162,.15);
  }

  /* Kleurfeedback op rooster-cellen */
  .cell-ok  { background: #e6f4ea !important; }   /* lichtgroen */
  .cell-err { background: #ffe8e8 !important; }   /* lichtrood  */
    
  </style>
</head>
<body>

  <div id="app">
    <h1>Staartdeling</h1>

    <div id="controls">
      <button id="btnNew" class="primary">Nieuwe oefening</button>
      <button id="btnCheck">Nakijken</button>
      <button id="btnSelf">Zelfcontrole</button>

      <label>
        Moeilijkheid:
        <select id="difficulty">
          <option value="1">Basis</option>
          <option value="2">Makkelijk</option>
          <option value="3">Gemiddeld</option>
          <option value="4">Moeilijk</option>
          <option value="5">Zeer moeilijk</option>
        </select>
      </label>

      <!-- NIEUW: stap-voor-stap vinkje en nakijk-knop -->
      <label>
        <input type="checkbox" id="chkStepMode">
        Stap‑voor‑stap invullen
      </label>

      <button id="btnCheckSteps">Nakijk werkblad</button>
    </div>

    <div id="opgaveZone">
      <span id="opgaveTekst"></span>
      <input id="inputQuotient" type="text" class="smallInput" inputmode="decimal" placeholder="quotiënt">
      <span class="rLabel">r</span>
      <input id="inputRest" type="text" class="smallInput" inputmode="numeric" placeholder="rest">
      <!-- Hint voor niveau 5 -->
      <div id="level5Hint" aria-live="polite" hidden>
      Tip: in het werkveld rekenen we eerst zonder komma in de deler (weggeschaald).
      De opgave en je antwoorden blijven in de originele schaal.
      </div>
    </div>

    <div id="feedbackPanel" aria-live="polite"></div>
    
    <div id="gridWrapper">
      <div id="leftSide">
        <div id="grid"></div>
        <div id="workArea"></div>
      </div>

      <div id="verticalLine"></div>

      <div id="rightSide">
        <div id="divGrid"></div>
        <div id="bar"></div>
        <div id="quotientRow"></div>
      </div>
    </div>
  </div>
  
  <div id="stepInputs" hidden></div>
  
  <!-- Extern script -->
  <script src="script.js" defer></script>
</body>
</html>
